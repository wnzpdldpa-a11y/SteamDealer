<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>가격 히스토리 | Steam Dealer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body data-page="history">
    <header class="site" id="site-header"></header>
    <main class="wrap">
        <p class="eyebrow">Price History &amp; Pattern</p>
        <h1>할인기록을 비교하고<br><span>구매타이밍을 읽어보세요</span></h1>
        <p class="lead">게임별 할인 날짜, 할인률, 현재가와 역대 최저가를 비교합니다.<br>아래 기록은 기능 시연을 위한 예시 데이터이며 실시간 Steam 가격이력이 아닙니다.</p>
        <div class="filters"><input id="q" type="search" placeholder="게임 이름 검색" aria-label="게임 검색"><select id="sort"
                aria-label="정렬"></select></div>
        <div class="tbl">
            <table>
                <thead>
                    <tr>
                        <th>게임</th>
                        <th>장르</th>
                        <th>현재 할인</th>
                        <th>현재가</th>
                        <th>역대 최저가</th>
                        <th>최대할인 이력</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </main>
    <footer class="site" id="site-footer"></footer>
    <script src="../js/app.js"></script>
</body>

</html>
