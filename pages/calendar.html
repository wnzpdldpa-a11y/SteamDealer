<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>세일 캘린더 | Steam Dealer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body data-page="calendar">
    <header class="site" id="site-header"></header>
    <main class="wrap">
        <p class="eyebrow">Seasonal Sale Forecast</p>
        <h1>세일 시즌을<br><span>미리 준비하세요</span></h1>
        <p class="lead">기념일과 계절 행사에 따라 할인할 가능성이 상대적으로 높은 장르를 정리했습니다.<br>특정 게임의 실제 할인 여부를 보장하는 예측이 아니라 일반적인 프로모션 경향을 바탕으로
            한 참고형 안내입니다.</p>
        <h2 class="sec">다가오는 기념일 &amp; 시즌</h2>
        <div class="seasons" id="seasons" style="margin-top:36px"></div>
        <h2 class="sec">관심 장르를 저장해 두세요</h2>
        <p class="sub">다음 단계에서는 이 설정을 바탕으로 캘린더와 알림 기능을 연결할 수 있습니다.</p>
        <div class="panel">
            <div class="chips" id="chips"></div>
            <p class="picked" id="picked"></p>
        </div>
    </main>
    <footer class="site" id="site-footer"></footer>
    <script src="../js/app.js"></script>
</body>

</html>
